# --- 电脑端（Windows）构建配置 ---
# 沙盒里那套「省内存」的收紧参数已放宽：电脑上并行 + 增量编译。
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configureondemand=false

# 关掉原生文件监视：本沙箱不允许该原生库打开线程（error = 5），
# 且 workspace-write 策略下也没必要开。
org.gradle.vfs.watch=false

# 增量编译打开（沙盒里为了省内存关掉了）
kotlin.incremental=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# 允许给 SourceSet 传 Provider（移动适配插件的资产是构建期生成的）。
# AGP 默认禁止，因为它无法判断 Provider 指向的是生成物还是可写静态目录；
# 代价是任务依赖不会自动接上，app/build.gradle.kts 里已显式 dependsOn。
android.sourceset.disallowProvider=false
